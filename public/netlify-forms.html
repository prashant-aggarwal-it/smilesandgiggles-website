<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Netlify Form Definitions</title>
</head>
<body>
  <!--
    Static Netlify form blueprints for framework form detection.
    This file is intentionally unlinked and exists only so Netlify's build bot
    can discover every field used by the React/Next.js forms.
  -->

  <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input type="email" name="email" />
    <input name="phone" />
    <input name="organisation" />
    <input name="geography" />
    <input name="preferredContact" />
    <input name="enquiryType" />
    <textarea name="message"></textarea>
  </form>

  <form name="get-involved" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="get-involved" />
    <input name="bot-field" />
    <input name="interest" />
    <input name="name" />
    <input type="email" name="email" />
    <input name="phone" />
    <input name="city" />
    <input name="profession" />
    <input name="availability" />
    <input name="areaOfInterest" />
    <input name="contributionType" />
    <input name="mode" />
    <input name="experience" />
    <input name="school" />
    <input name="schoolLocation" />
    <input name="learners" />
    <input name="program" />
    <input name="company" />
    <input name="teamSize" />
    <input name="teamSkills" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
